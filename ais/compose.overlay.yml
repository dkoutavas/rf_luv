# AIS Ship Tracking Pipeline (overlay)
# AIS-catcher (decoder) -> ais-ingest (NMEA->ClickHouse)
#
# This is a ROTATING pipeline overlay. The always-on data layer
# (shared ClickHouse + Grafana) lives in infra/compose.yml as the
# rf_luv_infra project. Bring infra up first, then use pipeline.sh:
#   bash infra/up.sh
#   bash pipeline.sh up ais v3-01      # pauses the V3 scanner for the session
#   open http://localhost:3000 for Grafana dashboards (shared)
#   bash pipeline.sh down ais v3-01    # restores the V3 scanner
#
# Dongle: marine AIS is VHF (161.975 + 162.025 MHz), so it runs on the V3
# (the good VHF dongle) whose rtl_tcp the spectrum scanner normally holds.
# `pipeline.sh up ais v3-01` pauses rtl-scanner@v3-01 for the session and
# hands rtl_tcp on host.docker.internal:${RTL_TCP_PORT} to AIS-catcher; ADS-B
# on the V4 keeps running. The water-damaged V4 is 16.5 dB down at VHF, so it
# is not the AIS dongle.
#
# AIS-catcher auto-tunes to 161.975 + 162.025 MHz (dual-channel).
# Point dipole antenna SW toward Piraeus, arms ~44 cm, vertical.
#
# ClickHouse is reached over the shared rf_luv_net network at the
# alias `clickhouse` on HTTP port 8123.

networks:
  rf_luv_net:
    external: true

services:

  # --- AIS Decoder ----------------------------------------
  # AIS-catcher connects to rtl_tcp, demodulates dual-channel AIS,
  # and sends decoded NMEA sentences to ais-ingest via UDP.
  ais-decoder:
    image: ghcr.io/jvde-github/ais-catcher:v0.62
    container_name: ais-decoder
    restart: unless-stopped
    networks: [rf_luv_net]
    depends_on:
      - ais-ingest
    # AIS_GAIN defaults to tuner AGC (auto): the bare V3 sits next to strong
    # Athens FM, so a fixed 40 dB overloads the front end. Set AIS_GAIN to a
    # number (dB) to pin it while comparing antennas.
    command: >
      -t rtltcp host.docker.internal ${RTL_TCP_PORT:-1235}
      -gt tuner ${AIS_GAIN:-auto}
      -u ais-ingest 10110
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- AIS Ingest Worker ----------------------------------
  # Receives NMEA over UDP, decodes AIVDM payloads, batch-inserts to ClickHouse.
  ais-ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    container_name: ais-ingest
    restart: unless-stopped
    networks: [rf_luv_net]
    environment:
      AIS_UDP_PORT: "10110"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ais
      CLICKHOUSE_USER: ais
      CLICKHOUSE_PASSWORD: ais_local
      BATCH_SIZE: "500"
      FLUSH_INTERVAL_SECONDS: "5"
