apiVersion: 1

# Consolidated datasources for the shared Grafana instance.
# One datasource per ClickHouse database on the single shared server.
# All connect over the NATIVE protocol to clickhouse:9000 inside rf_luv_net.
# Exactly one isDefault:true (spectrum, the primary steady tenant).

datasources:
  - name: ClickHouse adsb
    uid: P_ADSB_CLICKHOUSE
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      defaultDatabase: adsb
      username: adsb
    secureJsonData:
      password: adsb_local
    editable: true

