# ISM Band Device Monitoring Pipeline (overlay)
# rtl_433 (decoder) -> ism_ingest.py (JSON->ClickHouse), one container.
#
# This is a ROTATING pipeline overlay. The always-on data layer
# (shared ClickHouse + Grafana) lives in infra/compose.yml as the
# rf_luv_infra project. Bring it up with pipeline.sh, not docker compose:
#   bash infra/up.sh
#   bash pipeline.sh up ism <serial>     # pauses that dongle's scanner
#   open http://localhost:3000 for Grafana dashboards (shared)
#   bash pipeline.sh down ism <serial>   # resumes that dongle's scanner
#
# Dongle: rtl_433 is an rtl_tcp client on host.docker.internal:${RTL_TCP_PORT}.
# pipeline.sh reads the port from /etc/rtl-scanner/<serial>.env. rtl_tcp serves
# one client at a time, so pipeline.sh pauses rtl-scanner@<serial> for the
# session. The decoder does not take the rtl-coordinator lock.
# 433.92 MHz is UHF, so the water-damaged V4 works too (about 3.5 dB down).
# ADS-B and POCSAG stop rtl_tcp on the dongle they hold, so pick another one.
#
# Decodes weather stations, tire sensors, doorbells, remotes, etc.
# at 433.92 MHz. Dipole arms ~16.4 cm, vertical, at window.
#
# ClickHouse is reached over the shared rf_luv_net network at the
# alias `clickhouse` on HTTP port 8123.

networks:
  rf_luv_net:
    external: true

services:

  # --- rtl_433 + Ingest (combined) ------------------------
  # Single container: rtl_433 pipes JSON to Python ingest script.
  # Combined because the pipe is the simplest IPC -- no networking
  # overhead, no UDP buffering, and rtl_433 exit = ingest exit.
  rtl433-ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    container_name: rtl433-ingest
    restart: unless-stopped
    networks: [rf_luv_net]
    environment:
      RTL_TCP_HOST: host.docker.internal
      RTL_TCP_PORT: "${RTL_TCP_PORT:-1234}"
      ISM_FREQ: "433.92M"
      ISM_GAIN: "40"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ism
      CLICKHOUSE_USER: ism
      CLICKHOUSE_PASSWORD: ism_local
      BATCH_SIZE: "200"
      FLUSH_INTERVAL_SECONDS: "10"
    extra_hosts:
      - "host.docker.internal:host-gateway"
